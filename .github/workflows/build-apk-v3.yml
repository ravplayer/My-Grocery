name: Build My Market APK v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: unzip My-Market-Android-Project-v3.zip -d source

      - name: Build APK
        working-directory: source/MyMarketAndroid
        run: gradle assembleDebug

      - name: Verify APK exists
        run: find source -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Market-APK-v3
          path: source/MyMarketAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
